name: Integration

# Runs the agent against a throwaway NetBox (netbox-docker). Manual only;
# not required for merging.
on:
  workflow_dispatch:
    inputs:
      netbox_docker_ref:
        description: netbox-docker release tag (empty = main)
        required: false
        default: ""
      version:
        description: NetBox image tag matching that release, e.g. v4.1-3.0.2 (empty = the compose default)
        required: false
        default: ""

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: ./test/integration/run.sh
        env:
          NETBOX_DOCKER_REF: ${{ inputs.netbox_docker_ref }}
          VERSION: ${{ inputs.version || '' }}
