# Release builds include NVML (GPU serials) and IAP support. NVML needs cgo,
# so each architecture uses its own C cross compiler (see release workflow).
version: 2
project_name: groundtruth-agent

builds:
  - &build
    id: linux-amd64
    main: ./cmd/groundtruth-agent
    binary: groundtruth-agent
    goos: [linux]
    goarch: [amd64]
    tags: [nvml, iap]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]
    env:
      - CGO_ENABLED=1
      - CC=x86_64-linux-gnu-gcc
      - CGO_CFLAGS=-O2 -Wno-deprecated-declarations
  - <<: *build
    id: linux-arm64
    goarch: [arm64]
    env:
      - CGO_ENABLED=1
      - CC=aarch64-linux-gnu-gcc
      - CGO_CFLAGS=-O2 -Wno-deprecated-declarations

archives:
  - formats: [tar.gz]
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md
      - THIRD_PARTY_LICENSES.md
      - examples/*
      - deploy/systemd/*

nfpms:
  - package_name: groundtruth-agent
    homepage: https://github.com/frauniki/netbox-groundtruth-agent
    maintainer: netbox-groundtruth-agent maintainers <noreply@github.com>
    description: A NetBox agent that records observed hardware facts (serials, CPUs, memory, disks, NICs, GPUs) in NetBox.
    license: Apache-2.0
    formats: [deb]
    bindir: /usr/bin
    contents:
      - src: deploy/systemd/groundtruth-agent.service
        dst: /usr/lib/systemd/system/groundtruth-agent.service
      - src: deploy/systemd/groundtruth-agent.timer
        dst: /usr/lib/systemd/system/groundtruth-agent.timer
      - src: examples/config.yaml
        dst: /etc/groundtruth-agent/config.yaml
        type: config|noreplace
        file_info:
          mode: 0640
      - src: examples/custom-fields.yaml
        dst: /usr/share/doc/groundtruth-agent/custom-fields.yaml
      - src: LICENSE
        dst: /usr/share/doc/groundtruth-agent/LICENSE
      - src: THIRD_PARTY_LICENSES.md
        dst: /usr/share/doc/groundtruth-agent/THIRD_PARTY_LICENSES.md

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive
  - id: packages
    artifacts: package

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

changelog:
  disable: true # CHANGELOG.md is maintained by hand

release:
  draft: true
